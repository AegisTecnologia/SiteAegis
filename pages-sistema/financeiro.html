<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro</title>
        <link rel="stylesheet" href="../css/pages.css">

<body>
    <h1>Financeiro</h1>
<!-- Container HTML -->
<div id="livecard-feed"></div>

<!-- Script SDK -->
<script src="https://livecard-hub.ai.studio/embed/livecard.js"></script>
<script>
  // Inicializa o LiveCard com sincronização em tempo real (SSE + REST)
  document.addEventListener('DOMContentLoaded', function() {
    const feed = LiveCard.init({
      container: '#livecard-feed',
      apiUrl: 'https://livecard-hub.ai.studio',
      theme: 'modern',          // 'modern', 'cyberDark', 'glass', 'minimal', 'editorial'
      limit: 22,
      showBadges: true,
      showLikes: true,
      targetUrl: 'https://aegistecnologia.com/pages-sistema/anotacoes-gerais.html', // Filtra por página de destino
      onCardClick: function(card) {
        console.log('Card clicado:', card.title);
      }
    });

    // Opcional: recarregar manualmente se necessário
    // feed.refresh();
  });
</script>
<!-- 1. Container onde os cards serão renderizados -->
<div id="livecard-feed"></div>

<!-- 2. Script LiveCard com sincronização em tempo real -->
<script 
  src="https://ais-dev-ubeg6ozfbmd7eapwrwepxw-820834115471.us-east1.run.app/embed/livecard.js" 
  data-container="#livecard-feed">
</script>
</body>
</html>
