<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação de caixa</title>
        <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <h1>Movimentação de caixa</h1>
    <!-- Embed Aegis Tecnologia Live Documentation -->
<!-- 1. Crie o elemento onde os cards serão renderizados -->
<div id="livecard-feed"></div>

<!-- 2. Adicione a tag de script ultraleve do LiveCard -->
<!-- Container HTML -->
<div id="livecard-feed"></div>

<!-- Script SDK -->
<script src="https://livecard-hub.ai.studio/embed/livecard.js"></script>
<script>
  // Inicializa o LiveCard com sincronização em tempo real (SSE + REST)
  document.addEventListener('DOMContentLoaded', function() {
    const feed = LiveCard.init({
      container: '#livecard-feed',
      apiUrl: 'https://livecard-hub.ai.studio',
      theme: 'modern',          // 'modern', 'cyberDark', 'glass', 'minimal', 'editorial'
      limit: 6,
      showBadges: true,
      showLikes: true,
      onCardClick: function(card) {
        console.log('Card clicado:', card.title);
      }
    });

    // Opcional: recarregar manualmente se necessário
    // feed.refresh();
  });
</script>
<!-- 1. Local onde os cards serão renderizados -->
<div id="livecard-feed"></div>

<!-- 2. Script do LiveCard em tempo real -->
<script 
  src="https://ais-dev-ubeg6ozfbmd7eapwrwepxw-820834115471.us-east1.run.app/embed/livecard.js" 
  data-container="#livecard-feed"
  data-theme="modern"
  data-limit="6"
  async>
</script>
</body>
</html>
