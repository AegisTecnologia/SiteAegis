<!-- Widget de Notícias Aegis (SDK Oficial Firebase) -->
<div id="noticias-aegis-container" style="max-width: 900px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <p style="text-align: center; color: #64748b; padding: 20px;">Carregando notícias em tempo real...</p>
</div>

<!-- SDKs Oficialmente Suportados pelo Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
(function initAegisNewsWidget() {
  const container = document.getElementById('noticias-aegis-container');

  const firebaseConfig = {
    apiKey: "AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA",
    authDomain: "gen-lang-client-0364245624.firebaseapp.com",
    projectId: "gen-lang-client-0364245624",
    storageBucket: "gen-lang-client-0364245624.firebasestorage.app",
    messagingSenderId: "660410062775",
    appId: "1:660410062775:web:78910cc411e0508e517a32"
  };

  async function loadArticles() {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      // Conecta ao banco de dados específico do CMS Aegis
      const db = firebase.app().firestore("ai-studio-cmsdenotcias-2778bd05-0a56-4171-8d18-45821a3f8331");
      
      const snapshot = await db.collection("news").get();

      if (snapshot.empty) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Nenhuma notícia cadastrada no momento.</p>';
        return;
      }

      const allDocs = [];
      snapshot.forEach(doc => {
        allDocs.push({ id: doc.id, ...doc.data() });
      });

      // Filtra matérias publicadas e ordena da mais recente para a mais antiga
      const published = allDocs
        .filter(a => a.status === 'published' || !a.status)
        .sort((a, b) => new Date(b.publishedAt || b.createdAt || 0) - new Date(a.publishedAt || a.createdAt || 0));

      if (published.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Nenhuma notícia publicada no momento.</p>';
        return;
      }

      container.innerHTML = published.map(art => `
        <article style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
          ${art.coverImage ? `<img src="${art.coverImage}" alt="${art.title}" style="width:100%; max-height:280px; object-fit:cover; border-radius:8px; margin-bottom:14px;" />` : ''}
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <span style="background:#e0f2fe; color:#0369a1; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase;">${art.category || 'Geral'}</span>
            <small style="color:#94a3b8; font-size:12px;">${art.publishedAt ? new Date(art.publishedAt).toLocaleDateString('pt-BR') : ''}</small>
          </div>
          <h3 style="font-size:20px; color:#0f172a; margin:0 0 6px 0; font-weight:700; line-height:1.3;">${art.title}</h3>
          ${art.subtitle ? `<p style="font-size:14px; color:#475569; margin:0 0 12px 0; line-height:1.5;">${art.subtitle}</p>` : ''}
          ${art.body ? `<div style="font-size:14px; color:#334155; line-height:1.6; margin-top:10px;">${art.body}</div>` : ''}
        </article>
      `).join('');

    } catch (err) {
      console.error("Erro ao carregar notícias Firebase:", err);
      container.innerHTML = '<p style="color:#ef4444; text-align:center; padding:20px;">Erro ao carregar notícias: ' + (err.message || err) + '</p>';
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    loadArticles();
  } else {
    document.addEventListener('DOMContentLoaded', loadArticles);
  }
})();
</script>
    </section>

<script src="../js/noticias.js"></script>
