<!-- Widget de Notícias Aegis (Conexão Direta ao Firebase) -->
<div id="noticias-aegis-container" style="max-width: 900px; margin: 0 auto; font-family: sans-serif;">
  <p style="text-align: center; color: #64748b;">Carregando notícias...</p>
</div>

<script>
(async function loadAegisNews() {
  const container = document.getElementById('noticias-aegis-container');
  const firestoreUrl = 'https://firestore.googleapis.com/v1/projects/gen-lang-client-0364245624/databases/ai-studio-cmsdenotcias-2778bd05-0a56-4171-8d18-45821a3f8331/documents/news?key=AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA';

  try {
    const res = await fetch(firestoreUrl);
    const data = await res.json();
    
    if (!data.documents || data.documents.length === 0) {
      container.innerHTML = '<p style="text-align:center;">Nenhuma notícia publicada no momento.</p>';
      return;
    }

    const articles = data.documents.map(doc => {
      const f = doc.fields || {};
      return {
        id: f.id?.stringValue || doc.name.split('/').pop(),
        title: f.title?.stringValue || 'Sem título',
        subtitle: f.subtitle?.stringValue || '',
        category: f.category?.stringValue || 'Geral',
        coverImage: f.coverImage?.stringValue || '',
        status: f.status?.stringValue || '',
        publishedAt: f.publishedAt?.stringValue || f.createdAt?.stringValue || new Date().toISOString()
      };
    }).filter(a => a.status === 'published' || !a.status).slice(0, 5);

    if (articles.length === 0) {
      container.innerHTML = '<p style="text-align:center;">Nenhuma notícia publicada no momento.</p>';
      return;
    }

    container.innerHTML = articles.map(art => `
      <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05); font-family:sans-serif;">
        ${art.coverImage ? `<img src="${art.coverImage}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:12px;" />` : ''}
        <span style="background:#e0f2fe; color:#0369a1; font-size:11px; font-weight:bold; padding:3px 8px; border-radius:12px; text-transform:uppercase;">${art.category}</span>
        <h3 style="font-size:18px; color:#0f172a; margin:8px 0 4px 0; font-weight:bold;">${art.title}</h3>
        <p style="font-size:14px; color:#475569; margin:0 0 12px 0;">${art.subtitle}</p>
        <small style="color:#94a3b8; font-size:11px;">Publicado em ${new Date(art.publishedAt).toLocaleDateString('pt-BR')}</small>
      </div>
    `).join('');

  } catch (err) {
    container.innerHTML = '<p style="color:#ef4444; text-align:center;">Erro ao carregar notícias do servidor.</p>';
  }
})();
</script>
    </section>
