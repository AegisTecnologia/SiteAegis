<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias e Novidades</title>
    <link rel="stylesheet" href="../css/noticias.css">
    <style>
      /* Grid: widgets lado a lado com quebra automática */
      #noticias-aegis-container.noticias-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
        transition: all 0.3s ease;
      }
      /* Cada widget ocupa metade do espaço (2 por linha) e é responsivo */
      #noticias-aegis-container.noticias-grid article {
        flex: 0 0 calc(50% - 16px);
        max-width: calc(50% - 16px);
        box-sizing: border-box;
      }
      /* Força imagens a ocupar o espaço do card */
      #noticias-aegis-container.noticias-grid article img {
        width: 100% !important;
        height: auto !important;
        max-height: 300px;
        object-fit: cover !important;
        display: block;
        border-radius: 8px;
      }
      @media (max-width: 720px) {
        #noticias-aegis-container.noticias-grid article {
          flex: 0 0 100%;
          max-width: 100%;
        }
      }
      @media print {
        #noticias-aegis-container.noticias-grid article {
          page-break-inside: avoid;
          break-inside: avoid;
          page-break-after: always;
        }
      }
    </style>
</head>
<body>

    <a href="../index.html" class="back-home">
        <img src="../img/aegisTecnologiaLogo.png" alt="Aegis Tecnologia">
    </a>

    <section id="beneficios" class="pagina beneficios">
      <span>NOTÍCIAS E NOVIDADES</span>
      <h2>Confira as novidades!</h2>
      <div class="guia">
        <p class="link">Acesse aqui o <a href="https://isabellamahfud.github.io/aegisGuia/">Guia de reforma</a></p>
      </div>
    </section>

<div id="noticias-aegis-container" class="noticias-grid">
  <p style="text-align:center; color:#64748b; padding:20px; width:100%;">Carregando notícias em tempo real...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA",
  authDomain: "gen-lang-client-0364245624.firebaseapp.com",
  projectId: "gen-lang-client-0364245624",
  storageBucket: "gen-lang-client-0364245624.firebasestorage.app",
  messagingSenderId: "660410062775",
  appId: "1:660410062775:web:78910cc411e0508e517a32"
};

async function loadAegisNews() {
  const container = document.getElementById('noticias-aegis-container');
  if (!container) return;

  try {
    const app = initializeApp(firebaseConfig);
    const articlesMap = new Map();

    const dbIds = ["ai-studio-cmsdenotcias-2778bd05-0a56-4171-8d18-45821a3f8331", "(default)"];
    
    for (const dbId of dbIds) {
      try {
        const db = dbId === "(default)" ? getFirestore(app) : getFirestore(app, dbId);
        const querySnapshot = await getDocs(collection(db, "news"));
        
        querySnapshot.forEach((doc) => {
          articlesMap.set(doc.id, { id: doc.id, ...doc.data() });
        });
      } catch (err) {
        console.warn("Consulta Firestore no banco " + dbId + " aviso:", err);
      }
    }

    if (articlesMap.size === 0) {
      for (const dbId of dbIds) {
        try {
          const url = `https://firestore.googleapis.com/v1/projects/gen-lang-client-0364245624/databases/${dbId}/documents/news?key=AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data.documents && Array.isArray(data.documents)) {
              data.documents.forEach(doc => {
                const f = doc.fields || {};
                const id = f.id?.stringValue || doc.name.split('/').pop();
                articlesMap.set(id, {
                  id,
                  title: f.title?.stringValue || 'Sem título',
                  subtitle: f.subtitle?.stringValue || '',
                  category: f.category?.stringValue || 'Geral',
                  coverImage: f.coverImage?.stringValue || '',
                  body: f.body?.stringValue || '',
                  status: f.status?.stringValue || 'published',
                  publishedAt: f.publishedAt?.stringValue || f.createdAt?.stringValue || new Date().toISOString()
                });
              });
            }
          }
        } catch (e) {
          console.warn("Rest API fallback notice:", e);
        }
      }
    }

    const allArticles = Array.from(articlesMap.values());
    
    const published = allArticles
      .filter(a => a.status === 'published' || !a.status)
      .sort((a, b) => new Date(b.publishedAt || b.createdAt || 0) - new Date(a.publishedAt || a.createdAt || 0));

    if (published.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Nenhuma notícia publicada no momento.</p>';
      return;
    }

    // Renderiza cada card ajustando altura dinamicamente (com ou sem imagem)
    container.innerHTML = published.map(art => {
      const hasImage = art.coverImage && art.coverImage.trim().length > 5;
      const imgHtml = hasImage 
        ? `<div style="margin-bottom:14px; overflow:hidden; border-radius:8px; background:#f1f5f9;">
             <img src="${art.coverImage}" alt="${art.title}" onerror="this.parentElement.style.display='none';" style="width:100%; max-height:300px; object-fit:cover; display:block; border-radius:8px;" />
           </div>` 
        : '';

      return `
        <article style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.04); display:flex; flex-direction:column; justify-content:space-between; transition:all 0.2s ease-in-out;">
          <div>
            ${imgHtml}
            <div style="display:flex; align-items:center; flex-wrap: wrap; gap:8px; margin-bottom:10px;">
              <span style="background:#e0f2fe; color:#0369a1; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase;">${art.category || 'Geral'}</span>
              <small style="color:#94a3b8; font-size:12px;">${art.publishedAt ? new Date(art.publishedAt).toLocaleDateString('pt-BR') : ''}</small>
            </div>
            <h3 style="font-size:20px; color:#0f172a; margin:0 0 8px 0; font-weight:700; line-height:1.35;">${art.title}</h3>
            ${art.subtitle ? `<p style="font-size:14px; color:#475569; margin:0 0 12px 0; line-height:1.5; font-weight:500;">${art.subtitle}</p>` : ''}
            ${art.body ? `<div style="font-size:14px; color:#334155; line-height:1.6; margin-top:8px;">${art.body}</div>` : ''}
          </div>
        </article>
      `;
    }).join('');

  } catch (err) {
    console.error("Erro geral ao carregar notícias:", err);
    container.innerHTML = '<p style="color:#ef4444; text-align:center; padding:20px;">Erro ao carregar notícias.</p>';
  }
}

loadAegisNews();
</script>

<script src="../js/noticias.js"></script>
<script type="module" src="../js/supabase-auth.js"></script>
<script src="../js/header.js"></script>

</body>
</html>
