
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias e Novidades</title>
    <link rel="stylesheet" href="../css/noticias.css">
    <style>
      /* Grid: widgets lado a lado com quebra automática */
      #noticias-aegis-container.noticias-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        justify-content: center;
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
        transition: all 0.3s ease;
      }
      /* Cada widget ocupa metade do espaço (2 por linha) e é responsivo */
      #noticias-aegis-container.noticias-grid article {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      /* Força imagens a ocupar o espaço do card */
      #noticias-aegis-container.noticias-grid article img {
        width: 100% !important;
        height: auto !important;
        max-height: 300px;
        object-fit: cover !important;
        display: block;
        border-radius: 8px;
      }
      @media (max-width: 720px) {
        #noticias-aegis-container.noticias-grid article {
          flex: 0 0 100%;
          max-width: 100%;
        }
      }
      @media print {
        #noticias-aegis-container.noticias-grid article {
          page-break-inside: avoid;
          break-inside: avoid;
          page-break-after: always;
        }
      }
    </style>
</head>

        <img src="../img/aegisTecnologiaLogo.png" alt="Aegis Tecnologia">
    </a>

    <section id="beneficios" class="pagina beneficios" style="padding: 20px 16px !important; margin-bottom: 0 !important;">
      <span>NOTÍCIAS E NOVIDADES</span>
      <h2>Confira as novidades!</h2>
    </section>
<!-- Widget Direct do Firebase (Com Imagem, Largura: 380px) -->
<div id="noticias-aegis-container" class="noticias-grid" style="max-width: 980px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif; transition: all 0.3s ease;">
  <p style="text-align: center; color: #64748b; padding: 20px; grid-column: 1 / -1;">Carregando notícias em tempo real...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA",
  authDomain: "gen-lang-client-0364245624.firebaseapp.com",
  projectId: "gen-lang-client-0364245624",
  storageBucket: "gen-lang-client-0364245624.firebasestorage.app",
  messagingSenderId: "660410062775",
  appId: "1:660410062775:web:78910cc411e0508e517a32"
};

async function loadAegisNews() {
  const container = document.getElementById('noticias-aegis-container');
  if (!container) return;

  try {
    const app = initializeApp(firebaseConfig);
    const articlesMap = new Map();

    const dbIds = ["ai-studio-cmsdenotcias-2778bd05-0a56-4171-8d18-45821a3f8331", "(default)"];
    
    for (const dbId of dbIds) {
      try {
        const db = dbId === "(default)" ? getFirestore(app) : getFirestore(app, dbId);
        const querySnapshot = await getDocs(collection(db, "news"));
        
        querySnapshot.forEach((doc) => {
          articlesMap.set(doc.id, { id: doc.id, ...doc.data() });
        });
      } catch (err) {
        console.warn("Consulta Firestore no banco " + dbId + " aviso:", err);
      }
    }

    if (articlesMap.size === 0) {
      for (const dbId of dbIds) {
        try {
          const url = `https://firestore.googleapis.com/v1/projects/gen-lang-client-0364245624/databases/${dbId}/documents/news?key=AIzaSyD81tP9W21NKdoAUKIQ5TKbXnGsRGGaVaA`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data.documents && Array.isArray(data.documents)) {
              data.documents.forEach(doc => {
                const f = doc.fields || {};
                const id = f.id?.stringValue || doc.name.split('/').pop();
                articlesMap.set(id, {
                  id,
                  title: f.title?.stringValue || 'Sem título',
                  subtitle: f.subtitle?.stringValue || '',
                  category: f.category?.stringValue || 'Geral',
                  coverImage: f.coverImage?.stringValue || '',
                  body: f.body?.stringValue || '',
                  externalLink: f.externalLink?.stringValue || '',
                  externalLinkLabel: f.externalLinkLabel?.stringValue || '',
                  status: f.status?.stringValue || 'published',
                  publishedAt: f.publishedAt?.stringValue || f.createdAt?.stringValue || new Date().toISOString()
                });
              });
            }
          }
        } catch (e) {
          console.warn("Rest API fallback notice:", e);
        }
      }
    }

    const allArticles = Array.from(articlesMap.values());
    
    const published = allArticles
      .filter(a => a.status === 'published' || !a.status)
      .sort((a, b) => new Date(b.publishedAt || b.createdAt || 0) - new Date(a.publishedAt || a.createdAt || 0))
      .slice(0, 10);

    if (published.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Nenhuma notícia publicada no momento.</p>';
      return;
    }

    const showImage = true;
    const showBody = true;

    container.innerHTML = published.map(art => {
      const hasImage = showImage && art.coverImage && art.coverImage.trim().length > 5;
      const imgHtml = hasImage 
        ? `<div style="margin-bottom:12px; overflow:hidden; border-radius:8px; background:#f1f5f9;">
             <img src="${art.coverImage}" alt="${art.title}" onerror="this.parentElement.style.display='none';" style="width:100%; max-height:220px; object-fit:cover; display:block; border-radius:8px;" />
           </div>` 
        : '';

      const bodyHtml = showBody && art.body 
        ? `<div style="font-size:13px; color:#334155; line-height:1.6; margin-top:10px; padding-top:10px; border-top:1px solid #f1f5f9;">
             ${art.body.replace(/\n/g, '<br/>')}
           </div>`
        : '';

      const extLinkUrl = art.externalLink ? (art.externalLink.startsWith('http') ? art.externalLink : 'https://' + art.externalLink) : '';
      const extLinkBtn = (art.externalLink && art.externalLink.trim().length > 0)
        ? `<div style="margin-top:12px; padding-top:10px; border-top:1px solid #f1f5f9; display:flex; justify-content:flex-end;">
             <a href="${extLinkUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:6px; background:#2563eb; color:#ffffff; font-size:12px; font-weight:700; text-decoration:none; padding:8px 14px; border-radius:8px; box-shadow:0 1px 3px rgba(37,99,235,0.3); transition:background 0.2s;">
               ${art.externalLinkLabel || 'Acessar Link Externo'} ↗
             </a>
           </div>`
        : '';

      return `
        <article style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin:0; box-shadow:0 2px 6px rgba(0,0,0,0.03); display:flex; flex-direction:column; justify-content:space-between; transition:all 0.2s ease-in-out;">
          <div>
            ${imgHtml}
            <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px;">
              <span style="background:#e0f2fe; color:#0369a1; font-size:10px; font-weight:700; padding:3px 8px; border-radius:14px; text-transform:uppercase;">${art.category || 'Geral'}</span>
              <small style="color:#94a3b8; font-size:11px;">${art.publishedAt ? new Date(art.publishedAt).toLocaleDateString('pt-BR') : ''}</small>
            </div>
            <h3 style="font-size:17px; color:#0f172a; margin:0 0 6px 0; font-weight:700; line-height:1.35;">${art.title}</h3>
            ${art.subtitle ? `<p style="font-size:13px; color:#475569; margin:0 0 8px 0; line-height:1.45; font-weight:500;">${art.subtitle}</p>` : ''}
            ${bodyHtml}
            ${extLinkBtn}
          </div>
        </article>
      `;
    }).join('');

  } catch (err) {
    console.error("Erro geral ao carregar notícias:", err);
    container.innerHTML = '<p style="color:#ef4444; text-align:center; padding:20px;">Erro ao carregar notícias.</p>';
  }
}

loadAegisNews();
</script>

<script src="../js/noticias.js"></script>

</body>
