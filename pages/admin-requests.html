<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Solicitações</title>

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    .back-home {
      display: inline-block;
      margin-bottom: 20px;
    }

    .back-home img {
      width: 180px;
      height: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    #status {
      margin-bottom: 20px;
    }

    .req {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 12px;
      background: #fff;
    }

    .req strong {
      font-size: 18px;
    }

    .req div {
      margin-top: 6px;
    }

    .actions {
      margin-top: 15px;
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    .approve {
      background: #198754;
      color: white;
    }

    .reject {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .approved {
      color: green;
      font-weight: bold;
      margin-top: 12px;
    }

    .rejected {
      color: orange;
      font-weight: bold;
      margin-top: 12px;
    }

  </style>

</head>

<body>

  <a href="../index.html" class="back-home">
    <img
      src="../img/aegisTecnologiaLogo.png"
      alt="Aegis Tecnologia"
    >
  </a>

  <h1>Solicitações de Cadastro</h1>

  <p id="status">Verificando autenticação...</p>

  <div id="list"></div>

  <script type="module">

    import { app }
      from '../js/firebase-config.js';


    import {
      getAuth,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';


    import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  getDoc,
  updateDoc,
  doc,
  arrayUnion,
  setDoc,
  serverTimestamp
} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

    // =====================================================
    // FIREBASE
    // =====================================================

    const auth = getAuth(app);

    const db = getFirestore(
      app,
      'ai-studio-faf5b93d-e8d8-4798-90a4-96f05f6f5855'
    );


    // =====================================================
    // PROPRIETÁRIOS
    // =====================================================


    // =====================================================
    // URL DO SITE
    // =====================================================

    function getSiteUrl(relativePath) {

      const path =
        window.location.pathname;

      const base =
        path.replace(
          /\/pages\/.*$/,
          ''
        );

      const b =
        base === ''
          ? '/'
          : base;

      return (
        window.location.origin +
        b.replace(/\/$/, '') +
        '/' +
        relativePath.replace(/^\//, '')
      );
    }


    // =====================================================
    // AUTENTICAÇÃO DO ADMIN
    // =====================================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          alert(
            'Faça login como proprietário para acessar esta página.'
          );

          window.location.href =
            getSiteUrl(
              'pages/login.html'
            );

          return;
        }

// =====================================================
// VERIFICAR SE É ADMINISTRADOR
// =====================================================

const adminRef = doc(db, 'admins', user.uid);
const adminSnap = await getDoc(adminRef);

if (!adminSnap.exists() || adminSnap.data().ativo !== true) {

  alert(
    'Acesso negado: você não é administrador.'
  );

  window.location.href =
    getSiteUrl('index.html');

  return;
}

        document
          .getElementById('status')
          .textContent =
            'Autenticado como ' +
            (
              user.displayName ||
              user.email
            );


        await renderList();

      }
    );


    // =====================================================
    // LISTAR SOLICITAÇÕES
    // =====================================================

    async function renderList() {

      const listEl =
        document.getElementById(
          'list'
        );


      listEl.innerHTML = '';


      document
        .getElementById('status')
        .textContent =
          'Buscando solicitações pendentes...';


      try {

        const q =
          query(
            collection(
              db,
              'permission_requests'
            ),
            where(
              'status',
              '==',
              'pending'
            )
          );


        const snap =
          await getDocs(q);


        if (snap.empty) {

          document
            .getElementById('status')
            .textContent =
              'Nenhuma solicitação pendente.';

          return;
        }


        document
          .getElementById('status')
          .textContent =
            'Solicitações pendentes: ' +
            snap.size;


        snap.forEach(
          (docSnap) => {

            const data =
              docSnap.data();


            const id =
              docSnap.id;


            const el =
              document.createElement(
                'div'
              );


            el.className =
              'req';


            const dataSolicitacao =
              data.createdAt
                ? data.createdAt.toDate().toLocaleString('pt-BR')
                : '—';


            el.innerHTML = `

              <strong>
                ${data.displayName || 'Usuário'}
              </strong>

              <div>
                UID: ${data.uid || '—'}
              </div>

              <div>
                Email: ${data.email || '—'}
              </div>

              <div>
                Solicitado em: ${dataSolicitacao}
              </div>

              <div class="actions"></div>

            `;


            const actions =
              el.querySelector(
                '.actions'
              );


            // =============================================
            // BOTÃO APROVAR
            // =============================================

            const approve =
              document.createElement(
                'button'
              );


            approve.textContent =
              'Aprovar';


            approve.className =
              'approve';


            approve.addEventListener(
              'click',
              async () => {

                approve.disabled =
                  true;

                reject.disabled =
                  true;


                try {

                  // ---------------------------------------
                  // 1. APROVAR USUÁRIO
                  // ---------------------------------------

                  await updateDoc(
                    doc(
                      db,
                      'users',
                      data.uid
                    ),
                    {
                      status:
                        'approved',

                      approvedAt:
                        serverTimestamp()
                    }
                  );


                  // ---------------------------------------
                  // 2. APROVAR SOLICITAÇÃO
                  // ---------------------------------------

                  await updateDoc(
                    doc(
                      db,
                      'permission_requests',
                      id
                    ),
                    {
                      status:
                        'approved',

                      handledAt:
                        serverTimestamp(),

                      handledBy:
                        auth.currentUser.uid
                    }
                  );


                  // ---------------------------------------
                  // 3. LIBERAR DOWNLOADS
                  // ---------------------------------------

                  const permRef =
                    doc(
                      db,
                      'permissions',
                      'downloads'
                    );


                  try {

                    await updateDoc(
                      permRef,
                      {
                        allowedUids:
                          arrayUnion(
                            data.uid
                          )
                      }
                    );

                  } catch (e) {

                    await setDoc(
                      permRef,
                      {
                        allowedUids:
                          [data.uid]
                      }
                    );

                  }


                  el.style.opacity =
                    '0.5';


                  actions.innerHTML = `

                    <div class="approved">
                      ✓ Cadastro aprovado com sucesso.
                    </div>

                  `;


                } catch (err) {

                  console.error(
                    'Erro ao aprovar usuário:',
                    err
                  );


                  alert(
                    'Erro ao aprovar. Veja o console.'
                  );


                  approve.disabled =
                    false;

                  reject.disabled =
                    false;

                }

              }
            );


            // =============================================
            // BOTÃO REJEITAR
            // =============================================

            const reject =
              document.createElement(
                'button'
              );


            reject.textContent =
              'Rejeitar';


            reject.className =
              'reject';


            reject.addEventListener(
              'click',
              async () => {

                reject.disabled =
                  true;

                approve.disabled =
                  true;


                try {

                  // ---------------------------------------
                  // 1. REJEITAR USUÁRIO
                  // ---------------------------------------

                  await updateDoc(
                    doc(
                      db,
                      'users',
                      data.uid
                    ),
                    {
                      status:
                        'rejected',

                      rejectedAt:
                        serverTimestamp()
                    }
                  );


                  // ---------------------------------------
                  // 2. REJEITAR SOLICITAÇÃO
                  // ---------------------------------------

                  await updateDoc(
                    doc(
                      db,
                      'permission_requests',
                      id
                    ),
                    {
                      status:
                        'rejected',

                      handledAt:
                        serverTimestamp(),

                      handledBy:
                        auth.currentUser.uid
                    }
                  );


                  el.style.opacity =
                    '0.5';


                  actions.innerHTML = `

                    <div class="rejected">
                      ✕ Cadastro rejeitado.
                    </div>

                  `;


                } catch (err) {

                  console.error(
                    'Erro ao rejeitar usuário:',
                    err
                  );


                  alert(
                    'Erro ao rejeitar. Veja o console.'
                  );


                  approve.disabled =
                    false;

                  reject.disabled =
                    false;

                }

              }
            );


            actions.appendChild(
              approve
            );


            actions.appendChild(
              reject
            );


            listEl.appendChild(
              el
            );

          }
        );

      } catch (err) {

        console.error(
          'Erro ao carregar solicitações:',
          err
        );


        document
          .getElementById('status')
          .textContent =
            'Erro ao carregar solicitações.';


        alert(
          'Erro ao carregar solicitações. Verifique as Rules do Firestore e o console.'
        );

      }

    }

  </script>

</body>

</html>
